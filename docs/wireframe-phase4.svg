<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Phase 4 wireframe: map on top, menu rail left, merged chart + present card right</title>
  <defs>
    <style>
      .lbl{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:1.2px;fill:#5a6275}
      .t{font-size:14px;fill:#1d2a44}
      .ts{font-size:12px;fill:#1d2a44}
      .mute{font-size:12px;fill:#6b7280}
      .note{font-size:12px;fill:#8a5a2b;font-style:italic}
      .hair{stroke:#cfc8b8;stroke-width:1;fill:none}
      .edge{stroke:#9a958a;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="1200" height="1080" fill="#f7f3ea"/>

  <!-- TOP BAR -->
  <text x="24" y="34" class="t" font-weight="600">[App name]</text>
  <text x="150" y="34" class="mute">Bookshop sales · Fictional demo data</text>
  <rect x="420" y="18" width="120" height="24" fill="#e3e9f2" stroke="#5b7aa8"/>
  <circle cx="436" cy="30" r="7" fill="#5b7aa8"/><text x="436" y="34" font-size="10" fill="#fff" text-anchor="middle">S</text>
  <text x="450" y="34" class="ts">Store owner ▾</text>
  <rect x="820" y="18" width="90" height="24" class="hair"/><text x="865" y="34" class="ts" text-anchor="middle">Load CSV</text>
  <rect x="920" y="18" width="120" height="24" class="hair"/><text x="980" y="34" class="ts" text-anchor="middle">Use demo data</text>
  <rect x="1060" y="18" width="52" height="24" class="hair"/><text x="1086" y="35" class="t" text-anchor="middle">←</text>
  <rect x="1120" y="18" width="52" height="24" class="hair"/><text x="1146" y="35" class="t" text-anchor="middle">→</text>
  <text x="1060" y="56" class="note">back/forward = visit order</text>
  <line x1="0" y1="64" x2="1200" y2="64" class="hair"/>

  <!-- MAP (EXPANDED) -->
  <rect x="24" y="76" width="1152" height="250" fill="#fbf9f4" class="hair"/>
  <text x="40" y="98" class="lbl">YOUR THINKING SO FAR · 6 QUESTIONS EXPLORED</text>
  <text x="1160" y="98" class="ts" text-anchor="end">Collapse ▲</text>

  <!-- edges -->
  <path class="edge" d="M240 210 C255 210 255 150 270 150"/>
  <path class="edge" d="M240 210 L270 210"/>
  <path class="edge" d="M240 210 C255 210 255 270 270 270"/>
  <path class="edge" d="M470 150 C485 150 485 125 500 125"/>
  <path class="edge" d="M470 150 C485 150 485 185 500 185" stroke-dasharray="5 4"/>
  <path class="edge" d="M700 125 L730 125"/>
  <path class="edge" d="M470 210 C485 210 485 245 500 245"/>

  <!-- nodes -->
  <g><rect x="40" y="192" width="200" height="36" fill="#ecebe6" stroke="#8a8a8a"/><text x="140" y="215" class="ts" text-anchor="middle">Data</text></g>

  <g><rect x="270" y="132" width="200" height="36" fill="#e3e9f2" stroke="#5b7aa8"/><circle cx="288" cy="150" r="8" fill="#5b7aa8"/><text x="288" y="154" font-size="10" fill="#fff" text-anchor="middle">S</text><text x="302" y="155" class="ts">format · items sold</text></g>
  <g><rect x="270" y="192" width="200" height="36" fill="#e3e9f2" stroke="#5b7aa8"/><circle cx="288" cy="210" r="8" fill="#5b7aa8"/><text x="288" y="214" font-size="10" fill="#fff" text-anchor="middle">S</text><text x="302" y="215" class="ts">genre · revenue</text></g>
  <g><rect x="270" y="252" width="200" height="36" fill="#efe5ec" stroke="#9a6a8f"/><circle cx="288" cy="270" r="8" fill="#9a6a8f"/><text x="288" y="274" font-size="10" fill="#fff" text-anchor="middle">M</text><text x="302" y="275" class="ts">revenue over time</text></g>

  <g><rect x="500" y="107" width="200" height="36" fill="#f3f6fa" stroke="#5b7aa8" stroke-dasharray="3 3"/><circle cx="518" cy="125" r="8" fill="#5b7aa8"/><text x="518" y="129" font-size="10" fill="#fff" text-anchor="middle">S</text><text x="532" y="130" class="ts">format is Mass market</text></g>
  <g><rect x="500" y="167" width="200" height="36" fill="#efe5ec" stroke="#9a6a8f"/><circle cx="518" cy="185" r="8" fill="#9a6a8f"/><text x="518" y="189" font-size="10" fill="#fff" text-anchor="middle">M</text><text x="532" y="190" class="ts">same view, as analyst</text></g>
  <g><rect x="500" y="230" width="60" height="30" fill="#fbf9f4" stroke="#9a958a"/><text x="530" y="250" class="ts" text-anchor="middle">+2</text></g>

  <g><rect x="730" y="107" width="200" height="36" fill="#e3e9f2" stroke="#d8652b" stroke-width="2.5"/><circle cx="748" cy="125" r="8" fill="#5b7aa8"/><text x="748" y="129" font-size="10" fill="#fff" text-anchor="middle">S</text><text x="762" y="130" class="ts">genre · items sold</text></g>
  <text x="940" y="130" class="note">← current node (accent outline)</text>

  <text x="40" y="312" class="mute">Solid line: new question, go deeper, or build my own · Dashed line: persona switch · Dashed box: a slice (no chart of its own) · "+2": folded off-path branch, click to open · Click any node to jump there</text>

  <!-- MAP (COLLAPSED) REFERENCE -->
  <text x="24" y="352" class="lbl">COLLAPSED STATE (DEFAULT) · SAME MAP AS ONE LINE</text>
  <rect x="24" y="360" width="1152" height="34" fill="#fbf9f4" class="hair"/>
  <circle cx="44" cy="377" r="6" fill="#8a8a8a"/><text x="56" y="381" class="ts">Data</text>
  <text x="96" y="381" class="mute">›</text>
  <circle cx="114" cy="377" r="6" fill="#5b7aa8"/><text x="126" y="381" class="ts">format · items sold</text>
  <text x="250" y="381" class="mute">›</text>
  <circle cx="268" cy="377" r="6" fill="#5b7aa8"/><text x="280" y="381" class="ts">format is Mass market</text>
  <text x="420" y="381" class="mute">›</text>
  <circle cx="438" cy="377" r="6" fill="#5b7aa8"/><text x="450" y="381" class="ts" font-weight="600">genre · items sold</text>
  <text x="900" y="381" class="mute">6 questions explored</text>
  <text x="1160" y="381" class="ts" text-anchor="end">Expand ▼</text>

  <!-- MENU RAIL -->
  <rect x="24" y="414" width="330" height="600" fill="#fbf9f4" class="hair"/>
  <text x="40" y="438" class="lbl">QUESTIONS</text>
  <text x="40" y="456" class="mute">where format is Mass market paperback</text>

  <rect x="40" y="470" width="298" height="96" fill="#fff" stroke="#d8652b" stroke-width="2"/>
  <text x="54" y="492" class="lbl" fill="#d8652b">HIGHLIGHTED</text>
  <text x="54" y="514" class="ts">Which genre has the most items sold</text>
  <text x="54" y="530" class="ts">where format is Mass market paperback?</text>
  <text x="54" y="550" class="mute">Looking at genre fits what you're doing:</text>
  <text x="54" y="562" class="mute">deciding where to invest.</text>

  <rect x="40" y="578" width="298" height="44" fill="#fff" class="hair"/>
  <text x="54" y="604" class="ts">Which publisher has the most items sold…?</text>
  <rect x="40" y="630" width="298" height="44" fill="#fff" class="hair"/>
  <text x="54" y="656" class="ts">Which series has the most items sold…?</text>
  <rect x="40" y="682" width="298" height="44" fill="#fff" class="hair"/>
  <text x="54" y="708" class="ts">How have items sold changed over time…?</text>

  <text x="40" y="752" class="mute">AI highlighting is off (no API key), so rules picked this.</text>
  <line x1="40" y1="772" x2="338" y2="772" class="hair"/>
  <text x="40" y="798" class="ts">+ Build my own chart</text>
  <text x="40" y="818" class="note">opens the field picker (up to 2 fields)</text>

  <text x="40" y="860" class="note">Trap options stay in the menu as ordinary</text>
  <text x="40" y="876" class="note">items; a repair sits right after the option</text>
  <text x="40" y="892" class="note">it repairs.</text>

  <!-- MERGED CARD -->
  <rect x="370" y="414" width="806" height="600" fill="#fff" class="hair"/>
  <text x="394" y="448" class="t" font-size="18" font-weight="600">Which genre has the most items sold where format is Mass market paperback?</text>
  <text x="394" y="470" class="mute">Chart is the hero of the card · click a bar to go deeper (new branch)</text>

  <g>
    <text x="394" y="510" class="ts">SciFi/Fantasy</text><rect x="520" y="498" width="520" height="16" fill="#d8652b"/>
    <text x="394" y="538" class="ts">Mystery</text><rect x="520" y="526" width="350" height="16" fill="#b9b3a6"/>
    <text x="394" y="566" class="ts">Romance</text><rect x="520" y="554" width="300" height="16" fill="#b9b3a6"/>
    <text x="394" y="594" class="ts">Fiction</text><rect x="520" y="582" width="70" height="16" fill="#b9b3a6"/>
    <text x="1050" y="510" class="note">accent = the group the headline</text>
    <text x="1050" y="524" class="note">is about (auto, Phase 5)</text>
  </g>

  <line x1="394" y1="626" x2="1152" y2="626" class="hair"/>
  <text x="394" y="652" class="t" font-weight="600">Say this</text>
  <text x="560" y="652" class="mute">Phase 5: headline + 2–3 talking points</text>

  <line x1="394" y1="676" x2="1152" y2="676" class="hair"/>
  <text x="394" y="702" class="t" font-weight="600">Don't say this</text>
  <text x="560" y="702" class="lbl">DRAFT</text>
  <text x="394" y="726" class="ts">• Bianca Thompson accounts for 78% of items sold in SciFi/Fantasy. Without that author, …</text>
  <text x="394" y="746" class="mute">Phase 4: findings listed with their existing text. Phase 5 rewrites them.</text>

  <line x1="394" y1="770" x2="1152" y2="770" class="hair"/>
  <text x="394" y="796" class="t" font-weight="600">If they ask</text>
  <text x="560" y="796" class="mute">Phase 5</text>

  <line x1="394" y1="820" x2="1152" y2="820" class="hair"/>
  <text x="394" y="846" class="t" font-weight="600">What this data can't tell you</text>
  <text x="640" y="846" class="mute">Phase 5 · always shown</text>

  <!-- NOTES -->
  <text x="24" y="1040" class="lbl">PREVIEW STATE</text>
  <text x="24" y="1060" class="mute">On the root, or right after going deeper (a slice with no chart yet), the card shows the highlighted question's chart labeled PREVIEW with a "Use this question" button; the four sections stay hidden until it's picked. Square corners, no shadows, one accent.</text>
</svg>
